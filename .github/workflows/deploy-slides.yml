name: Deploy Slides to Subdirectory

on:
  push:
    branches:
      - main

# 现代部署方式所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}courseware/ # 部署成功后在 Actions 页面显示的链接
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./courseware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './courseware/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build Slides
        run: npm run build

      # 为了将内容部署到子目录 courseware，我们需要在打包上传前，重构一下目录结构
      - name: Prepare subfolder for deployment
        run: |
          mkdir -p ../_site/courseware
          cp -r dist/* ../_site/courseware/

      # 上传构建产物
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site # 上传刚才准备好的整站目录

      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
