name: Deploy Slides to Subdirectory

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 移除了 cache 配置，彻底避免因找不到 lockfile 导致的报错

      # 容错安装：如果没有 package-lock.json，会自动降级使用 npm install
      - name: Install Dependencies
        run: |
          cd courseware
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json, using npm ci"
            npm ci
          else
            echo "package-lock.json not found, using npm install"
            npm install
          fi

      - name: Build Slides
        run: |
          cd courseware
          npm run build

      # 诊断步骤：在控制台打印打包后的文件，方便我们排查
      - name: Diagnose Build Output
        run: |
          echo "=== Checking courseware directory ==="
          ls -la courseware/
          if [ -d "courseware/dist" ]; then
            echo "=== dist directory exists ==="
            ls -la courseware/dist/
          else
            echo "=== WARNING: courseware/dist directory NOT found ==="
          fi

      # 准备部署目录
      - name: Prepare subfolder for deployment
        run: |
          mkdir -p _site/courseware
          if [ -d "courseware/dist" ]; then
            cp -R courseware/dist/. _site/courseware/
            echo "Successfully prepared _site/courseware"
          else
            echo "Error: dist directory does not exist. Deployment failed."
            exit 1
          fi

      # 上传构建产物
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      # 执行部署
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
