# source : https://sli.dev/guide/hosting

name: Deploy pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'courseware/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
 # 🌟 步骤 1：安装 pnpm (必须在 setup-node 之前)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest # 你可以使用 8 或 9，或者 'latest'
          run_install: false
          
# 🌟 步骤 2：设置 Node.js，并开启 pnpm 缓存机制
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm' 
          cache-dependency-path: 'courseware/pnpm-lock.yaml' 

      - name: Setup @antfu/ni
        run: npm i -g @antfu/ni

      - name: Install dependencies
      # ni 此时会自动调用 pnpm install
        run: pnpm install
        working-directory: courseware

      - name: Build Slidev
      # 在 courseware 目录下构建，并输出到 dist/courseware
        run: pnpm slidev build --base /${{github.event.repository.name}}/courseware/ --out dist/courseware
        working-directory: courseware

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: courseware/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
